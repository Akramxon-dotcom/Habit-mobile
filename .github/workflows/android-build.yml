name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Locate gradlew and build
        run: |
          GRADLEW_PATH=$(find . -maxdepth 4 -name "gradlew" | head -n 1)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "gradlew topilmadi! Repo tuzilishi:"
            find . -maxdepth 3 -type d
            exit 1
          fi
          GRADLEW_DIR=$(dirname "$GRADLEW_PATH")
          echo "Topildi: $GRADLEW_PATH (papka: $GRADLEW_DIR)"
          chmod +x "$GRADLEW_PATH"
          cd "$GRADLEW_DIR" && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: habit-debug-apk
          path: "**/app/build/outputs/apk/debug/*.apk"
